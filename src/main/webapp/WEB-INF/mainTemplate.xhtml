<?xml version='1.0' encoding='UTF-8' ?> 
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:p="primefaces" xmlns:ui="jakarta.faces.facelets" 
      xmlns:f="jakarta.faces.core" xmlns:h="jakarta.faces.html">

    <f:view locale="#{userBean.locale}" contentType="text/html" >
    <f:loadBundle var="msg" basename="messages" />
    <h:head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <link href="#{facesContext.externalContext.requestContextPath}/resources/css/default.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.requestContextPath}/resources/css/cssLayout.css" rel="stylesheet" type="text/css" />
        <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css" /> 
        <title><h:outputText value="#{msg['app']}"/></title>
    </h:head>

    <h:body>
        <div id="top" class="flex">
            <ui:insert name="top">
                <h2 id="top">
                <h:outputText value="#{msg['app']}"/> &emsp; 
                <h:outputText 
                    rendered="#{initParam['jakarta.faces.PROJECT_STAGE'] != null and (initParam['jakarta.faces.PROJECT_STAGE'] eq 'Development')}"
                    value="( #{initParam['jakarta.faces.PROJECT_STAGE']} )"/>
                </h2>
                <span class="ml-auto">
                    <h:form id="logout">
                    <p:commandButton rendered="#{userBean.loggedIn}" action="#{userBean.logout()}" value="#{msg['menu.logout']}" icon="pi pi-power-off"/> 
                    </h:form>
                </span>
            </ui:insert>
        </div>
        <div class="grid">
                <h:form id="side-menu" class="col-4" style="z-index: 1">
                    <p:menu>
                        <p:menuitem outcome="/index" value="#{msg['home']}" icon="pi pi-home" disabled="false"/> 
                        <ui:insert name="left"></ui:insert>
                    </p:menu>
                </h:form>                
            <div id="content" class="main_content col-8" style="z-index: 10">
                <ui:insert name="content">Main content</ui:insert>
            </div>
        </div>
        <div id="bottom">
            <ui:insert name="bottom">
                <p:panel rendered="#{userBean.loggedIn}">
                <span style="margin-right: 4em">
                Version <h:outputText value="#{initParam['choffice.version']}"/>
                </span>
                <span style="margin-right: 5px">
                <h:outputText value="#{userBean.userMap['nickname']} " />
                ( <h:outputText value="#{userBean.userMap['givenName']}" /> ) :
                </span>
                <!-- h:outputText value="#{userBean.name}"/ -->
                <h:outputText rendered="#{userBean.isInRole('deacons')}" styleClass="footer-crumb" value="deacon"/>
                <h:outputText rendered="#{userBean.isInRole('staff')}" styleClass="footer-crumb" value="staff"/>
                <h:outputText rendered="#{userBean.isInRole('librarians')}" styleClass="footer-crumb" value="librarians"/> 
                </p:panel>
                <h:outputText value="Debug message: #{applicationBean.debug}"/>
            </ui:insert>
        </div>

    </h:body>
</f:view>
</html>
