<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:p="primefaces" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core">
    <f:view locale="#{userBean.locale}" contentType="text/html" >
    <f:loadBundle var="msg" basename="messages" />
    <h:head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <link href="#{facesContext.externalContext.requestContextPath}/resources/css/default.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.requestContextPath}/resources/css/cssLayout.css" rel="stylesheet" type="text/css" />
        <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css" /> 
        <title><h:outputText value="#{msg['app']}"/></title>
<style>
    .ui-panelgrid.showcase-text-align-center .ui-grid-responsive .ui-panelgrid-cell {
        text-align: center;
    }

    .customPanelGrid .ui-panelgrid-content {
        align-items: center;
    }
</style>        
    </h:head>
    <h:body>
        <h2 id="top">
                <h:outputText value="#{msg['app']}"/> &emsp; ( <h:outputText value="#{initParam['jakarta.faces.PROJECT_STAGE']}"/> )
        </h2>        
        <div class="card m-3">
        <h:form>
            <p:panelGrid columns="4" layout="flex" styleClass="showcase-text-align-center"
                 columnClasses="col-12 md:col-6 lg:col-3 xl:col-3, col-12 md:col-6 lg:col-3 xl:col-3, col-12 md:col-6 lg:col-3 xl:col-3, col-12 md:col-6 lg:col-3 xl:col-3">
                <p:linkButton outcome="/users/card" value="#{msg['legend.membercard']}" icon="pi pi-id-card" disabled="false"/> 
                <p:menuButton value="#{msg['menu.accounting']}">
                    <p:menuitem outcome="/entries/cheques" value="Cheques" icon="pi pi-money-bill" disabled="false"/> 
                </p:menuButton>
                <p:menuButton value="#{msg['offer']}">
                    <p:menuitem outcome="/offers/weekly" value="Weekly Report"  icon="pi pi-print"/>
                    <p:menuitem outcome="/offers/weekly" value="Weekly Report"  icon="pi pi-receipt"/>
                </p:menuButton>
                <p:menuButton value="Files">
                    <p:menuitem outcome="/file-system/list" icon="pi pi-folder" value="NAS" />
                    <p:menuitem outcome="/file-system/download" icon="pi pi-download" value="Download" />
                </p:menuButton>
                <p:commandButton rendered="#{userBean.loggedIn}" action="#{userBean.logout()}" value="#{msg['legend.logout']}" icon="pi pi-power-off" disabled="false"/> 
            </p:panelGrid>
            <h:messages showDetail="true" />
        </h:form>
        </div>
    </h:body>
    </f:view>
</html>
