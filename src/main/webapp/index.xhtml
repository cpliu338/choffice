<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:p="primefaces" 
      xmlns:ui="http://java.sun.com/jsf/facelets" 
      xmlns:h="http://java.sun.com/jsf/html">
    <body>

        <ui:composition template="WEB-INF/mainTemplate.xhtml">
            <ui:define name="left">
                <h:form>
                    <h:commandLink rendered="#{userBean.loggedIn}" action="#{userBean.logout()}">
                        <h:outputText value="#{msg['menu.logout']}"/>
                    </h:commandLink>
                </h:form>
            </ui:define>
            <ui:define name="content">
                <h:form>
                    <p:menu>
                        <p:menuitem outcome="/entries/cheques" value="#{msg['menu.accounting']}" icon="pi pi-home" disabled="false"/> 
                        <p:menuitem outcome="/users/card" value="#{msg['legend.membercard']}" icon="pi pi-id-card" disabled="false"/> 
                    </p:menu>
                </h:form>
                <p:panel>
                    <ul>
                        <li><h:outputLink value="library/home.jsf">
                            <h:outputText value="#{msg['legend.library']}"/>
                        </h:outputLink></li>
                        <li><h:outputLink value="offers/receipt.jsf">
                            <h:outputText value="#{msg['offer']} #{msg['menu.receipt']}"/>
                        </h:outputLink></li>
                        <li><h:outputLink value="nas/list.jsf">
                            <h:outputText value="NAS"/>
                        </h:outputLink></li>
                        <li><h:outputLink value="budget/list.jsf">
                            <h:outputText value="#{msg['legend.budget']}"/>
                        </h:outputLink></li>
                        <li><h:outputLink value="entries/reconcile.jsf">
                            <h:outputText value="#{msg['menu.accounting']}"/>
                        </h:outputLink></li>
                    </ul>
                </p:panel>
                <h:messages showDetail="true" />
            </ui:define>

        </ui:composition>

    </body>
</html>
