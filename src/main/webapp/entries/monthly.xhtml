<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="primefaces">
    <h:head>
        <title>Facelet Title</title>
    </h:head>
    <h:body>
        <ui:composition template="../WEB-INF/mainTemplate.xhtml">
            <ui:define name="content">
                <h1>Monthly Financial Report</h1>
                <h:form>
                    <p:outputLabel for="date" value="Report end date" accesskey="O" styleClass="m-2"/>
                    <p:datePicker value="#{dateReportBean.date}" id="date" />
                    <br/>
                    <p:commandButton value="Report" action="#{dateReportBean.monthlyReport}" icon="pi pi-print" update="msg"/>
                <p:messages globalOnly="true" showDetail="true" showSummary="true" showIcon="true" id="msg"/>
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
