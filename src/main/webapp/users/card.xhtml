<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces" xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">

    <body>

        <ui:composition template="../WEB-INF/mainTemplate.xhtml">
            <ui:define name="left">
                <h:form>
                    <p>
                    <h:commandLink rendered="#{userBean.loggedIn}" action="#{userBean.logout()}">Log out</h:commandLink>
                    </p><p>
                    <h:commandLink rendered="#{userBean.loggedIn}" action="cards?faces-redirect=true">Print cards</h:commandLink>
                    </p>
                </h:form>
            </ui:define>
            <ui:define name="content">
                <h1>Hello <h:outputText value="#{userBean.userMap['givenName']}"/></h1>
                <h2>Datapath is <h:outputText value="#{userBean.datapath}" /></h2>
            </ui:define>

        </ui:composition>

    </body>
</html>
